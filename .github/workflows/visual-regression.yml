name: Visual Regression

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'tests/visual/**'
      - 'tests/fidelity/**'
      - 'scripts/fidelity.mjs'
      - 'playwright.config.ts'
      - 'package.json'
      - 'vite.config.ts'
      - '.github/workflows/visual-regression.yml'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  visual-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm run test:visual
      - name: Compare against approved Figma references (when available)
        if: hashFiles('tests/fidelity/references/manifest.json') != ''
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 --strictPort &
          for i in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:4173/pixelcraft-ui/ > /dev/null; then break; fi
            sleep 1
          done
          npm run fidelity:verify
      - name: Upload screenshots and diffs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: visual-regression-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
